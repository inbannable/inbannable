<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">inbannable / William Xu</title>
  <desc id="desc">A charcoal terminal panel with a muted cyan signal diagram. Systems, signals, machines. Build quietly. Make it work.</desc>
