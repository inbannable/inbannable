<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">William Xu — systems, signals, machines</title>
  <desc id="desc">A midnight-blue systems lab. Lime signal traces travel through an orbital diagram. I build software that listens, decides, and moves.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b8c8dd" stroke-opacity=".055"/></pattern>
    <radialGradient id="halo"><stop stop-color="#b7f36b" stop-opacity=".12"/><stop offset="1" stop-color="#b7f36b" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orbit { transform-origin: 760px 200px; animation: orbit 24s linear 2; }
    .trace { stroke-dasharray: 20 580; animation: trace 6s linear 8; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes trace { to { stroke-dashoffset: -600; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .trace { animation: none; } }
  </style>
  <rect width="960" height="420" rx="16" fill="#101722"/>
  <rect x="1" y="1" width="958" height="418" rx="15" fill="url(#grid)" stroke="#2b3645"/>
  <circle cx="760" cy="200" r="190" fill="url(#halo)"/>
  <rect x="32" y="28" width="28" height="28" rx="7" fill="#b7f36b"/>
  <path d="m39 36 6 6-6 6m10 0h5" fill="none" stroke="#101722" stroke-width="2"/>
  <text x="72" y="47" class="mono" font-size="13" letter-spacing="1" fill="#e8eef5">INBANNABLE / LAB</text>
  <text x="926" y="46" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#9aaabd">SHANGHAI · CN</text>
  <path d="M32 76H928" stroke="#2b3645"/>
  <text x="38" y="122" class="mono" font-size="12" letter-spacing="2" fill="#b7f36b">HELLO, WORLD. I'M</text>
  <text x="32" y="193" font-size="68" font-weight="750" letter-spacing="-3" fill="#f1f5fa">William Xu<tspan fill="#b7f36b">.</tspan></text>
  <text x="36" y="238" font-size="25" letter-spacing="-.5" fill="#d2dce8">Systems. Signals. Machines.</text>
  <text x="36" y="278" font-size="16" fill="#9aaabd">I build software that listens, decides, and moves.</text>
  <g fill="none" stroke="#536640">
    <circle cx="760" cy="200" r="106" stroke-dasharray="2 7"/>
    <circle cx="760" cy="200" r="78" stroke-opacity=".8"/>
    <ellipse cx="760" cy="200" rx="118" ry="40" transform="rotate(-35 760 200)"/>
    <path d="M627 200H893M760 88V312" stroke-opacity=".55"/>
  </g>
  <g class="orbit">
    <circle cx="760" cy="94" r="5" fill="#b7f36b"/>
    <circle cx="760" cy="306" r="4" fill="#8dbaf5"/>
    <circle cx="760" cy="94" r="11" fill="none" stroke="#b7f36b" stroke-opacity=".3"/>
  </g>
  <circle cx="760" cy="200" r="46" fill="#15211d" stroke="#b7f36b" stroke-opacity=".6"/>
  <path d="M728 200h13l7-15 10 30 10-30 7 15h17" fill="none" stroke="#b7f36b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="760" y="335" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#b7f36b">INPUT → STATE → ACTION</text>
  <path d="M36 318H368l24 18h181l22-18h37" fill="none" stroke="#2b3645"/>
  <path class="trace" d="M36 318H368l24 18h181l22-18h37" fill="none" stroke="#b7f36b" stroke-width="2"/>
  <path d="M32 360H928" stroke="#2b3645"/>
  <text x="36" y="391" class="mono" font-size="11" letter-spacing="1" fill="#9aaabd">01 OBSERVE<tspan dx="26">02 MODEL</tspan><tspan dx="26">03 ITERATE</tspan></text>
  <text x="924" y="391" text-anchor="end" class="mono" font-size="11" fill="#b7f36b">BUILD QUIETLY. MAKE IT WORK.</text>
</svg>
